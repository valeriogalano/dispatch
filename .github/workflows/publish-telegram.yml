name: Publish Recap to Telegram

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date of the recap to publish (YYYY-MM-DD, default: latest)"
        required: false
        default: ""
  workflow_run:
    workflows: ["Generate Recap for Telegram"]
    types: [completed]

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve recap file
        id: file
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            FILE="output/recap-telegram-${{ github.event.inputs.date }}.md"
          else
            FILE=$(ls output/recap-telegram-*.md 2>/dev/null | sort | tail -1)
          fi
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "[error] no recap-telegram file found" >&2
            exit 1
          fi
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Send message to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          python3 publish_telegram.py "${{ steps.file.outputs.path }}"

      - name: Commit the sent marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/sent/
          git diff --cached --quiet || git commit -m "chore: mark telegram recap as sent"
          git pull --rebase
          git push
