name: Weekly Dev Digest

on:
  schedule:
    - cron: "0 18 * * 5"  # Every Friday at 18:00 UTC
    # hourly retries: every stage downstream is a no-op once it went through, so a
    # failed run recovers by itself instead of waiting for a manual re-run
    - cron: "0 19-22 * * 5"
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days to look back"
        required: false
        default: "7"

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Determine days parameter
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "days=${{ github.event.inputs.days }}" >> "$GITHUB_OUTPUT"
          else
            echo "days=7" >> "$GITHUB_OUTPUT"
          fi

      # the digest is named after the UTC date of the run: a retry that GitHub
      # starts late, past midnight, would write a second one under Saturday's
      # date and send a second recap (2026-09-26). One digest per week, so a
      # scheduled run that finds today's or yesterday's has nothing to do; the
      # chain downstream still runs and resumes whatever failed.
      - name: Run collect.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && \
             ls "output/digest-$(date -u +%F).md" "output/digest-$(date -u -d yesterday +%F).md" 2>/dev/null | grep -q .; then
            echo "[info] this week's digest already exists, not collecting again"
            exit 0
          fi
          .venv/bin/python collect.py --days ${{ steps.params.outputs.days }}

      # output/ is committed and would grow forever; git history keeps whatever is pruned
      - name: Prune output older than a year
        run: |
          for PREFIX in digest recap-blog recap-telegram; do
            ls output/${PREFIX}-*.md 2>/dev/null | sort | head -n -52 | xargs -r rm -v
          done
          ls output/sent/*.sent 2>/dev/null | sort | head -n -52 | xargs -r rm -v

      - name: Commit digest file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/
          git diff --cached --quiet || git commit -m "chore: add weekly digest $(date -u '+%Y-%m-%d')"
          git pull --rebase
          git push

