name: Generate Recap for Telegram

on:
  workflow_dispatch:
    inputs:
      digests:
        description: "Digest dates, comma-separated (YYYY-MM-DD,...); leave empty for the latest"
        required: false
        default: ""
  workflow_run:
    workflows: ["Generate Recap for Blog"]
    types: [completed]

jobs:
  generate:
    permissions:
      contents: write
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/_generate-recap.yml
    secrets: inherit
    with:
      format: telegram
      digests: ${{ github.event.inputs.digests || '' }}
      manual: ${{ github.event_name == 'workflow_dispatch' }}
