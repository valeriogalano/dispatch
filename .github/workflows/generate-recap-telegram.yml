name: Generate Recap for Telegram

on:
  workflow_dispatch:
    inputs:
      digests:
        description: "Digest dates, comma-separated (YYYY-MM-DD,...); leave empty for the latest"
        required: false
        default: ""
  workflow_run:
    workflows: ["Generate Recap for Blog"]
    types: [completed]

jobs:
  recap:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install google-genai

      - name: Build recap arguments
        id: args
        run: |
          INPUT="${{ github.event.inputs.digests }}"
          if [ -z "$INPUT" ]; then
            echo "flags=" >> "$GITHUB_OUTPUT"
            DATE=$(ls output/digest-*.md 2>/dev/null | sort | tail -1 | sed 's|.*digest-||' | sed 's|\.md||')
          else
            FLAGS=""
            FIRST_DATE=""
            IFS=',' read -ra DATES <<< "$INPUT"
            for DATE in "${DATES[@]}"; do
              DATE=$(echo "$DATE" | tr -d ' ')
              FILE="output/digest-${DATE}.md"
              if [ ! -f "$FILE" ]; then
                echo "[error] digest not found: $FILE" >&2
                exit 1
              fi
              FLAGS="$FLAGS --digest $FILE"
              [ -z "$FIRST_DATE" ] && FIRST_DATE="$DATE"
            done
            DATE="$FIRST_DATE"
            echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"
          fi
          echo "blog_url=https://pensieriincodice.it/blog/${DATE}-recap/" >> "$GITHUB_OUTPUT"

      - name: Run recap.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for i in 1 2 3; do
            .venv/bin/python recap.py --format telegram --blog-url "${{ steps.args.outputs.blog_url }}" ${{ steps.args.outputs.flags }} && exit 0
            echo "Attempt $i/3 failed"
            [ $i -lt 3 ] && sleep 60
          done
          exit 1

      - name: Commit recap files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/recap-telegram-*.md
          git diff --cached --quiet || git commit -m "chore: add telegram recap $(date -u '+%Y-%m-%d')"
          git push
