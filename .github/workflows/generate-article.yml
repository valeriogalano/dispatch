name: Generate Episode Article

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Episode numbers whose articles are already committed in output/, comma-separated (one PR)"
        required: true

# two runs must not publish the same article twice
concurrency:
  group: episode-article

jobs:
  article:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Checkout pensieriincodice-website
        uses: actions/checkout@v5
        with:
          repository: valeriogalano/pensieriincodice-website
          token: ${{ secrets.GH_TOKEN }}
          path: website

      # the articles are written in a Claude Code session and imported with
      # `article.py --import-text`: they are already committed, they only need the PR
      - name: List the articles to publish
        id: publish
        env:
          PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          NEW=""
          for N in $(echo "$PUBLISH" | tr ',' ' '); do
            F="output/article-${N}.md"
            if [ ! -f "$F" ]; then
              echo "[error] $F not found: import and commit it first" >&2
              exit 1
            fi
            NEW="$NEW $F"
          done
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      # the PR is opened, not merged: an article speaks with Valerio's voice
      - name: Open a PR on the website with the new articles
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NEW: ${{ steps.publish.outputs.new }}
        run: |
          REPO="valeriogalano/pensieriincodice-website"
          NUMBERS=""
          for F in $NEW; do
            N=$(basename "$F" .md | sed 's/^article-//')
            cp "$F" "website/content/blog/episodio-${N}.md"
            NUMBERS="$NUMBERS $N"
          done
          NUMBERS=$(echo $NUMBERS | tr ' ' '-')
          BRANCH="article/${NUMBERS}"

          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${REPO}.git"

          git checkout -B "$BRANCH"
          git add content/blog/episodio-*.md
          if git diff --cached --quiet; then
            echo "[info] articles ${NUMBERS} already on main, nothing to publish"
            exit 0
          fi

          git commit -m "feat: add the article for episode ${NUMBERS}"
          git push --force origin "$BRANCH"

          find_pr() {
            gh pr list --repo "$REPO" --head "$BRANCH" --state open --json url --jq '.[0].url'
          }

          # same retries as publish-website.yml: the API fails often enough to matter
          PR_URL=$(find_pr)
          for i in 1 2 3; do
            [ -n "$PR_URL" ] && break
            gh pr create \
              --repo "$REPO" \
              --title "Episode article ${NUMBERS}" \
              --body "Article adapted from the script of episode ${NUMBERS}, written in a Claude Code session." \
              --base main \
              --head "$BRANCH" || true
            PR_URL=$(find_pr)
            [ -n "$PR_URL" ] || sleep $((i * 15))
          done

          if [ -z "$PR_URL" ]; then
            echo "[error] could not create or find a PR for ${BRANCH}" >&2
            exit 1
          fi
          echo "[info] opened ${PR_URL}"
