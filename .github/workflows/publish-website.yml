name: Publish Recap to Website

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date of the recap to publish (YYYY-MM-DD, default: latest)"
        required: false
        default: ""
  workflow_run:
    workflows: ["Generate Recap for Blog"]
    types: [completed]

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout dev-updates repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve recap file
        id: file
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            FILE="output/${{ github.event.inputs.date }}-recap.md"
          else
            FILE=$(ls output/*-recap.md 2>/dev/null | sort | tail -1)
          fi
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "[error] no recap blog file found" >&2
            exit 1
          fi
          DATE=$(basename "$FILE" -recap.md)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Checkout pensieriincodice-website
        uses: actions/checkout@v4
        with:
          repository: valeriogalano/pensieriincodice-website
          token: ${{ secrets.GH_TOKEN }}
          path: website

      - name: Copy recap to website and open PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          DATE="${{ steps.file.outputs.date }}"
          BRANCH="recap/${DATE}"
          DEST="website/content/blog/${DATE}-recap.md"

          cp "${{ steps.file.outputs.path }}" "$DEST"

          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/valeriogalano/pensieriincodice-website.git"
          git checkout -b "$BRANCH"
          git add "content/blog/${DATE}-recap.md"
          git commit -m "feat: add recap post for ${DATE}"
          git push origin "$BRANCH"

          gh pr create \
            --repo valeriogalano/pensieriincodice-website \
            --title "Recap ${DATE}" \
            --body "Post recap settimanale generato automaticamente da dev-updates per il ${DATE}." \
            --base main \
            --head "$BRANCH"
