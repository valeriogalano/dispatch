name: Publish Recap to Website

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date of the recap to publish (YYYY-MM-DD, default: latest)"
        required: false
        default: ""
  workflow_run:
    workflows: ["Generate Recap for Blog"]
    types: [completed]

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout dev-updates repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve recap file
        id: file
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            FILE="output/recap-blog-${{ github.event.inputs.date }}.md"
          else
            FILE=$(ls output/recap-blog-*.md 2>/dev/null | sort | tail -1)
          fi
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "[error] no recap blog file found" >&2
            exit 1
          fi
          DATE=$(basename "$FILE" .md | sed 's/^recap-blog-//')
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Checkout pensieriincodice-website
        uses: actions/checkout@v4
        with:
          repository: valeriogalano/pensieriincodice-website
          token: ${{ secrets.GH_TOKEN }}
          path: website

      - name: Copy recap to website and open PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          DATE="${{ steps.file.outputs.date }}"
          REPO="valeriogalano/pensieriincodice-website"
          BRANCH="recap/${DATE}"
          DEST="website/content/blog/${DATE}-recap.md"

          cp "${{ steps.file.outputs.path }}" "$DEST"

          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${REPO}.git"

          # -B instead of -b: a re-run after a failed later step must not die on an existing branch
          git checkout -B "$BRANCH"
          git add "content/blog/${DATE}-recap.md"

          if git diff --cached --quiet; then
            echo "[info] recap for ${DATE} already on main, nothing to publish"
            exit 0
          fi

          git commit -m "feat: add recap post for ${DATE}"
          git push --force origin "$BRANCH"

          find_pr() {
            gh pr list --repo "$REPO" --head "$BRANCH" --state open --json url --jq '.[0].url'
          }

          # the GitHub API returns transient errors often enough to break the workflow chain
          PR_URL=$(find_pr)
          for i in 1 2 3; do
            [ -n "$PR_URL" ] && break
            gh pr create \
              --repo "$REPO" \
              --title "Recap ${DATE}" \
              --body "Post recap settimanale generato automaticamente da dev-updates per il ${DATE}." \
              --base main \
              --head "$BRANCH" || true
            PR_URL=$(find_pr)
            [ -n "$PR_URL" ] || sleep $((i * 15))
          done

          if [ -z "$PR_URL" ]; then
            echo "[error] could not create or find a PR for ${BRANCH}" >&2
            exit 1
          fi

          for i in 1 2 3; do
            gh pr merge "$PR_URL" --merge && exit 0
            sleep $((i * 15))
          done

          echo "[error] could not merge ${PR_URL}" >&2
          exit 1
